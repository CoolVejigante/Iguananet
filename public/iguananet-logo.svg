<svg viewBox="0 0 380 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iguanaCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00E5FF" />
      <stop offset="60%" stopColor="#00B4D8" />
      <stop offset="100%" stopColor="#0077B6" />
    </linearGradient>

    <linearGradient id="iguanaBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0077B6" />
      <stop offset="100%" stopColor="#023E8A" />
    </linearGradient>

    <linearGradient id="iguanaPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3A0CA3" />
      <stop offset="100%" stopColor="#1E0059" />
    </linearGradient>

    <linearGradient id="iguanaGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2EC4B6" />
      <stop offset="60%" stopColor="#20A39E" />
      <stop offset="100%" stopColor="#0E7C7B" />
    </linearGradient>

    <linearGradient id="iguanaSpikesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D4FC79" />
      <stop offset="100%" stopColor="#96E6A1" />
    </linearGradient>

    <linearGradient id="inWordmarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>

    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

