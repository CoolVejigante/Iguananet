    <rect x="38" y="28" width="18" height="74" fill="url(#inWordmarkGrad)" rx="2" />
    <path d="M 38 44 C 38 33 48 28 62 28 C 76 28 88 34 88 48 L 88 102 L 70 102 L 70 52 C 70 44 65 42 58 42 C 50 42 46 46 46 54 L 46 102 L 38 102 Z" fill="url(#inWordmarkGrad)" />

    <rect x="100" y="84" width="18" height="18" fill="#164E63" rx="2" />
