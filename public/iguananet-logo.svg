    <path d="M 95 45 C 105 45 125 55 130 75 C 132 82 125 90 115 92 C 105 93 90 85 85 70 C 82 60 88 48 95 45 Z" fill="url(#iguanaPurpleGrad)" />
    <path d="M 120 86 L 140 88 L 132 94 L 144 98 L 128 100 L 115 92 Z" fill="#240046" />

    <path d="M 55 35 C 75 32 105 38 115 50 C 120 60 110 75 95 80 C 75 85 60 75 55 60 Z" fill="url(#iguanaBlueGrad)" />
