    <path d="M 60 22 C 72 20 88 22 96 32 C 102 40 100 50 90 56 C 78 62 62 58 54 48 C 50 40 52 26 60 22 Z" fill="#0F4C81" />
    <path d="M 72 24 C 82 23 92 28 95 36 C 90 42 78 44 70 38 C 68 32 70 26 72 24 Z" fill="#0077B6" />
    <path d="M 85 34 C 98 32 108 36 112 42 C 110 48 98 52 88 48 Z" fill="#023E8A" />

    <circle cx="86" cy="30" r="4.5" fill="#FFFFFF" filter="url(#eyeGlow)" />
    <circle cx="86" cy="30" r="3" fill="#00FFFF" />
    <circle cx="86" cy="30" r="1.5" fill="#FFFFFF" />

    <path d="M 58 52 C 65 60 72 65 74 74 C 66 74 58 66 54 58 Z" fill="#1E0059" />
